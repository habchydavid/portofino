# Builds the static export and publishes it to GitHub Pages.
#
# Pages serves a project site from https://<user>.github.io/<repo>/, so the
# build runs with NEXT_PUBLIC_BASE_PATH set to that sub-path. Moving to a
# custom domain later means clearing both variables below (and setting
# NEXT_PUBLIC_SITE_URL to the new origin).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck

      # Derive the sub-path from the repository itself, so renaming the repo
      # moves the site without anyone editing this file. GITHUB_REPOSITORY is
      # "owner/name" on every event type, unlike the event payload.
      - name: Work out the Pages sub-path
        run: |
          NAME="${GITHUB_REPOSITORY#*/}"
          echo "NEXT_PUBLIC_BASE_PATH=/$NAME" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/$NAME" >> "$GITHUB_ENV"

      - name: Build static export
        run: npm run build

      # Pages would otherwise run the output through Jekyll, which strips
      # directories beginning with an underscore — including Next's _next.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
