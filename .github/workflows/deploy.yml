# Builds the static export and publishes it to GitHub Pages.
#
# Where the site is served from is worked out at run time from the Pages API
# (see "Work out the Pages URL"), so adding a custom domain, changing it, or
# renaming the repository all take effect on the next run with no edit here.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck

      # Work out where the site will actually be served from, and build for
      # that. The two cases need opposite base paths, and getting it wrong
      # makes every asset 404:
      #
      #   custom domain  →  served at the domain root      →  no base path
      #   no custom domain → served at /<repo>/            →  base path /<repo>
      #
      # Ask the Pages API rather than hard-coding either, so adding, changing
      # or removing a custom domain needs no edit here. Before Pages exists the
      # call 404s, which is the no-custom-domain case anyway.
      - name: Work out the Pages URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME="${GITHUB_REPOSITORY#*/}"
          CNAME="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.cname // empty' 2>/dev/null || true)"

          if [ -n "$CNAME" ]; then
            echo "Custom domain: $CNAME"
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://$CNAME" >> "$GITHUB_ENV"
            # Ships in the export so the domain survives every deploy.
            echo "$CNAME" > public/CNAME
          else
            echo "No custom domain; serving from /$NAME"
            echo "NEXT_PUBLIC_BASE_PATH=/$NAME" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/$NAME" >> "$GITHUB_ENV"
          fi

      - name: Build static export
        run: npm run build

      # Pages would otherwise run the output through Jekyll, which strips
      # directories beginning with an underscore — including Next's _next.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
